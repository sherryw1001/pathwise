<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathwise prototype</title>
<meta name="description" content="Pathwise: a student team's working prototype for exploring majors. Sample data. Scores are illustrative.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2A6B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B2A6B'/%3E%3Cpath d='M9 23c3-1 4-5 7-7s5-3 7-6' fill='none' stroke='%23F97316' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='23' r='2.7' fill='%235EEAD4'/%3E%3Ccircle cx='23' cy='10' r='2.7' fill='%235EEAD4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
/* ===== Pathwise prototype styles. Palette and type follow the original mockups. ===== */
:root{
  --navy:#1B2A6B;--orange:#F97316;--orange-edge:#C2410C;--orange-text:#EA580C;--orange-ink:#C2410C;
  --teal:#14B8A6;--teal-dark:#0F766E;--paper:#F7F5F0;--border:#E8E6E0;--body:#4B5563;--muted:#6B7280;
  --track:#E5E7EB;--aqua:#5EEAD4;--mint:#CCFBF1;--indigo:#E0E7FF;--select:#EEF2FF;--peach:#FFEDD5;--peach-text:#9A3412;
  --road:#3B4C9A;--row:#314079;--on-navy:#C7D2FE;--banner:#F0FDFA;--white:#fff;
  --shadow:0 1px 2px rgba(27,42,107,.05),0 10px 30px rgba(27,42,107,.06);
  --head:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--body);font:400 16px/1.55 var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--navy);font-family:var(--head);font-weight:700;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
img,svg{display:block;max-width:100%}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:100;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:1280px;margin:0 auto;padding:0 60px}
main:focus{outline:none}
h1[tabindex="-1"]:focus{outline:none}

/* nav */
.nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.nav-in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font:700 22px var(--head);flex:none}
.brand .proto{font:600 11px var(--text);letter-spacing:.06em;text-transform:uppercase;background:var(--peach);color:var(--peach-text);padding:3px 8px;border-radius:999px}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;color:var(--navy);text-decoration:none;font:500 15px var(--text);white-space:nowrap}
.nav-links a:hover{background:var(--select)}
.nav-links a.on{background:var(--navy);color:#fff}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:7px;border-radius:999px;background:var(--mint);color:var(--teal-dark);font:700 12px var(--text)}
.menu-btn{display:none;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);font-weight:600}
.banner-top{background:var(--navy);color:#fff;font-size:14px}
.banner-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.banner-top button{background:transparent;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:4px 14px;font-weight:600;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:12px;border:2px solid transparent;font:700 16px var(--text);text-decoration:none;cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn-primary{background:var(--orange);color:var(--navy);box-shadow:0 4px 0 var(--orange-edge)}
.btn-primary:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--orange-edge)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 0 0 var(--orange-edge)}
.btn-secondary{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn-secondary:hover{background:var(--select)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:10px}
.btn-xs{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px;border-width:1.5px}
.btn-saved{background:var(--mint);color:var(--teal-dark);border-color:var(--mint)}
.btn-danger{background:#fff;color:#9A3412;border-color:#9A3412}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.link-btn{background:none;border:0;padding:6px 2px;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.link-btn.sm{font-size:14px;font-weight:500}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:12px}

/* type */
.eyebrow{font:700 12px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-dark)}
.h1{font:700 48px/1.06 var(--head);color:var(--navy);letter-spacing:-.02em}
.h1 .a{color:var(--orange-text)}
.h2{font:700 32px/1.15 var(--head);color:var(--navy);letter-spacing:-.015em}
.h3{font:700 22px/1.25 var(--head);color:var(--navy)}
.lede{font-size:18px;line-height:1.55;max-width:640px}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.small{font-size:14px}
.bold{font-weight:600;color:var(--navy)}
.page{padding-top:40px;padding-bottom:80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:28px;flex-wrap:wrap}
.page-head .txt{max-width:780px}
.page-head .eyebrow{margin-bottom:12px}
.page-head .lede{margin-top:14px}

/* cards, chips, bars */
.card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.pad{padding:28px}
.pad-sm{padding:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font:600 13px/1.3 var(--text);background:#F3F1EC;color:var(--navy);border:1px solid var(--border)}
.chip svg{flex:none}
.chip-mint{background:var(--mint);color:var(--teal-dark);border-color:var(--mint)}
.chip-indigo{background:var(--indigo);color:var(--navy);border-color:var(--indigo)}
.chip-peach{background:var(--peach);color:var(--peach-text);border-color:var(--peach)}
.chip-navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip-plain{background:#fff}
.chip-sm{font-size:12px;padding:3px 10px}
.tag-ex{font:700 11px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-dark)}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--teal)}
.bar.sm{height:8px}
.bar.navy>i{background:var(--navy)}
.tile{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none}
.tile.lg{width:56px;height:56px;border-radius:16px}
.tile.sm{width:34px;height:34px;border-radius:10px}
.score{font:700 56px/1 var(--head);color:var(--teal-dark);letter-spacing:-.02em}
.score.md{font-size:34px}
.score.sm{font-size:22px}
.divider{border:0;border-top:1px solid var(--border);margin:24px 0}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--banner);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--navy)}
.callout svg{flex:none;margin-top:2px;color:var(--teal-dark)}
.callout.peach{background:var(--peach);color:var(--peach-text)}
.callout.peach svg{color:var(--peach-text)}
.callout.indigo{background:var(--select)}
.callout.indigo svg{color:var(--navy)}
.empty{text-align:center;padding:56px 24px}
.empty .h3{margin-bottom:8px}
.empty p{max-width:520px;margin:0 auto 20px}

/* three-flow stepper */
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.flow a,.flow span{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font:600 13px var(--text);text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--border)}
.flow .done{background:var(--mint);color:var(--teal-dark);border-color:var(--mint)}
.flow .now{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow i{width:20px;height:1px;background:var(--border);flex:none}

/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero .pill{display:inline-flex;align-items:center;gap:10px;background:var(--mint);color:var(--teal-dark);border:2px solid #99F6E4;border-radius:999px;padding:10px 18px;font:700 16px var(--text);margin-bottom:26px}
.hero .h1{font-size:58px}
.hero .lede{margin:22px 0 28px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:var(--body)}
.checks span{display:inline-flex;align-items:center;gap:6px}
.checks svg{color:var(--teal-dark)}
.hero-art{background:var(--navy);border-radius:28px;overflow:hidden;position:relative;aspect-ratio:518/460}
.hero-art svg{width:100%;height:100%}
.hero-card{position:absolute;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:14px 16px}
.hero-card.a{left:5%;top:19%;width:44%}
.hero-card.b{right:5%;bottom:6%;width:50%}
.stats{background:var(--navy);color:var(--on-navy)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;padding-top:44px;padding-bottom:44px}
.stats b{display:block;font:700 48px/1 var(--head);color:var(--aqua);margin-bottom:10px}
.stats .o{color:#FDBA74}
.stats span{font-size:15px;display:block;max-width:220px}
.band{padding:72px 0}
.band.white{background:#fff}
.center{text-align:center}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px}
.step{display:block;background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px;text-decoration:none;color:var(--body);box-shadow:0 1px 2px rgba(27,42,107,.04);transition:box-shadow .15s,transform .15s}
.step:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.step .n{font:700 11px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.step h3{font-size:19px;margin-bottom:8px}
.step p{font-size:14px;line-height:1.5}
.maj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:28px}
.maj{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(27,42,107,.04);min-height:166px;transition:box-shadow .15s,transform .15s}
.maj:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.maj b{font:700 17px/1.2 var(--head);color:var(--navy)}
.maj span.t{font-size:13.5px;line-height:1.45;color:var(--body)}
.react-demo{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.react-demo ul.dots li{display:flex;align-items:center;gap:12px;font-weight:500;color:var(--navy);padding:5px 0}
.react-demo ul.dots i{width:10px;height:10px;border-radius:50%;flex:none}
.rx{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rx button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:2px solid var(--border);background:#fff;color:var(--navy);font-weight:600;font-size:14px}
.rx button[aria-pressed="true"]{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}
.navy-panel{background:var(--navy);border-radius:20px;padding:20px;color:var(--on-navy)}
.navy-panel .rowx{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--row);border-radius:12px;padding:12px 14px;color:#fff;font-weight:600;font-size:15px}
.navy-panel .rowx+.rowx{margin-top:8px}
.navy-panel .rowx span{font-weight:400;font-size:13px;color:var(--on-navy)}
.cta-band{background:var(--peach);border-radius:28px;padding:44px 52px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta-band h2{font-size:36px;line-height:1.12;color:var(--navy)}
.cta-band p{color:var(--peach-text);margin-top:10px}

/* footer */
.foot{border-top:1px solid var(--border);background:var(--paper);margin-top:0}
.foot .wrap{display:flex;justify-content:space-between;gap:20px;padding-top:26px;padding-bottom:26px;flex-wrap:wrap;font-size:14px;align-items:center}
.foot b{color:var(--navy);font-family:var(--head)}
.foot .links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot a,.foot button.link-btn{color:var(--body)}

/* consent */
.consent-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.check-row{display:flex;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--border);border-radius:16px;background:#fff;cursor:pointer}
.check-row+.check-row{margin-top:12px}
.check-row input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.check-row.on{border-color:var(--teal);background:var(--banner)}
.check-row span{color:var(--navy);font-weight:500}
.check-row small{display:block;color:var(--body);font-weight:400;font-size:14px;margin-top:2px}
.err{color:#B91C1C;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;margin-top:12px}
.facts li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}
.facts li:last-child{border:0}
.facts svg{flex:none;color:var(--teal-dark);margin-top:3px}
.facts b{color:var(--navy)}

/* quiz */
.quiz-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.secchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}
.secchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font:600 13px var(--text);border:1px solid var(--border);background:#fff;color:var(--body)}
.secchip.done{background:var(--mint);color:var(--teal-dark);border-color:var(--mint)}
.secchip.now{background:var(--navy);color:#fff;border-color:var(--navy)}
.q-title{font:700 34px/1.12 var(--head);color:var(--navy);margin:6px 0 8px;letter-spacing:-.015em}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:#fff;border:2px solid var(--border);border-radius:18px;padding:16px;min-height:132px;position:relative;transition:border-color .12s,background .12s,transform .12s}
.opt:hover{border-color:#C7D2FE;transform:translateY(-1px)}
.opt b{font:700 16px/1.25 var(--head);color:var(--navy)}
.opt span.s{font-size:13.5px;line-height:1.4;color:var(--body)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--select)}
.opt .tick{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:none;place-items:center}
.opt[aria-pressed="true"] .tick{display:grid}
.q-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:22px}
.q-foot .grow{flex:1}
.picked{font-size:14px;color:var(--muted)}
.why-box{background:var(--select);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--navy);margin-top:6px}
.why-box b{display:block;font:700 12px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.profile .sigrow{display:grid;grid-template-columns:1fr;gap:6px;margin-top:14px}
.profile .sigrow small{display:flex;justify-content:space-between;font-size:13px;color:var(--navy);font-weight:600}
.told li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.told li:last-child{border:0}
.told li span.k{flex:none;width:86px;font:700 11px var(--text);letter-spacing:.07em;text-transform:uppercase;color:var(--teal-dark);padding-top:2px}
.side>*+*{margin-top:18px}

/* paths */
.noticed{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px 20px;margin-bottom:22px}
.hero-card-p{padding:32px 36px}
.top-badge{display:inline-flex;background:var(--navy);color:#fff;border-radius:999px;padding:5px 14px;font:700 12px var(--text);letter-spacing:.06em;text-transform:uppercase}
.cols3{display:grid;grid-template-columns:1fr 1.25fr 1.1fr;gap:36px;margin-top:22px}
.sub{font:700 12px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:12px}
.sub.o{color:var(--orange-ink)}
.why li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;color:var(--navy);font-size:16px;line-height:1.4}
.why li .ck{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--teal-dark);margin-top:1px}
.why li .ck.flag{background:var(--peach);color:var(--peach-text)}
.why li .ck.q{background:var(--select);color:var(--navy)}
.why li.flagged .tx{text-decoration:line-through;color:var(--muted)}
.why .from{display:inline-flex;margin-top:5px;background:var(--indigo);color:var(--navy);font:600 12px var(--text);padding:2px 10px;border-radius:999px}
.why .flagbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0;margin-left:2px;min-height:28px}
.why.less li{font-size:15px;color:var(--body)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.start-list{display:grid;gap:10px}
.start{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--navy);text-align:left;border:0;width:100%}
.start b{display:block;font:600 15px var(--text);color:var(--navy)}
.start span.s{font-size:13px;color:var(--body)}
.start:hover{background:#F0EEE7}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:24px;margin-top:26px}
.actions .grow{flex:1;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.card-mid{padding:26px 28px}
.card-mid .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-mid .name{font:700 28px/1.1 var(--head);color:var(--navy)}
.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 48px;margin-top:24px}
.rrow{text-decoration:none;display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:14px;background:none;border:0;text-align:left;width:100%}
.rrow:hover{background:var(--paper)}
.rrow .n{width:26px;font:700 20px var(--head);color:var(--navy);flex:none}
.rrow .mid{flex:1;min-width:0}
.rrow .mid b{display:block;font:600 15px var(--text);color:var(--navy);margin-bottom:6px}
.rrow .p{font:700 16px var(--head);color:var(--teal-dark);width:44px;text-align:right;flex:none}
.mixtbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.mixtbl th,.mixtbl td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.mixtbl th{font-weight:600;color:var(--navy)}
.mixtbl .bars{display:grid;gap:3px;min-width:120px}
details.how{background:var(--paper);border-radius:14px;padding:12px 16px;margin-top:18px}
details.how summary{cursor:pointer;font-weight:600;color:var(--navy);list-style:none;display:flex;gap:8px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how[open] summary svg{transform:rotate(180deg)}
.legend{display:flex;gap:16px;font-size:13px;margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.log li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.log li:last-child{border:0}
.log time{flex:none;width:94px;color:var(--muted);font-size:13px}

/* major page + compare */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:14px;color:var(--navy);margin-bottom:18px;padding:6px 0}
.major-head{display:flex;gap:20px;align-items:center;margin-bottom:26px}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.cmp-wrap{overflow-x:auto;border-radius:24px}
.cmp{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;background:#fff}
.cmp th,.cmp td{padding:16px 18px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);font-size:14.5px}
.cmp thead th{font:700 18px var(--head);color:var(--navy);background:#fff}
.cmp tbody th{width:170px;font:700 12px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark)}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.pick-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.pick-row label{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--navy);cursor:pointer}
.pick-row label.on{border-color:var(--navy);background:var(--select)}
.pick-row input{accent-color:var(--navy);width:18px;height:18px}
.cmp ul li{padding:2px 0}
.cmp ul li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:2px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);display:grid;place-items:center;padding:20px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:24px;max-width:640px;width:100%;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:calc(100vh - 40px);overflow:auto}
.modal h2{font-size:26px;margin-bottom:8px}
.modal .x{float:right;background:none;border:0;padding:8px;margin:-8px -8px 0 8px;border-radius:10px;color:var(--navy)}
.modal .foot-row{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.radio{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:2px solid var(--border);border-radius:14px;cursor:pointer;margin-top:10px}
.radio.on{border-color:var(--navy);background:var(--select)}
.radio input{width:20px;height:20px;accent-color:var(--navy);margin-top:2px;flex:none}
.radio b{display:block;color:var(--navy)}
.radio small{color:var(--body);font-size:14px}
.field{width:100%;border:2px solid var(--border);border-radius:12px;padding:12px 14px;font:400 15px/1.5 var(--text);color:var(--navy);background:#fff;resize:vertical}
.field::placeholder{color:var(--muted)}
select.field{width:auto;min-height:40px;padding:6px 10px;font-size:14px;resize:none}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,520px);pointer-events:none}
.toast{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.toast svg{color:var(--aqua);flex:none}

/* courses */
.stepper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 26px}
.stepper span.s{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font:600 14px var(--text);background:#fff;border:1px solid var(--border);color:var(--navy)}
.stepper .s.done{background:var(--mint);border-color:var(--mint);color:var(--teal-dark)}
.stepper .s.now{background:var(--navy);border-color:var(--navy);color:#fff}
.stepper i{width:24px;height:2px;background:var(--border)}
.cols-c{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.drop{border:2px dashed var(--teal);background:var(--banner);border-radius:18px;padding:22px 18px;text-align:center;transition:background .12s}
.drop.over{background:var(--mint)}
.drop .tile{background:var(--mint);color:var(--teal-dark);margin:0 auto 10px}
.found{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin-top:12px}
.found b{font:700 30px/1 var(--head);color:var(--navy);text-align:left}
.found b.t{color:var(--teal-dark)}
.found span{font-size:14px;line-height:1.35}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.tab{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:2px solid var(--border);background:#fff;color:var(--navy);padding:9px 18px;font:600 14.5px var(--text);min-height:44px}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab.sm{min-height:38px;padding:5px 14px;font-size:14px}
.crow{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:0}
.crow .mid{flex:1;min-width:0}
.crow .ttl{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 18px/1.25 var(--head);color:var(--navy);background:none;border:0;padding:0;text-align:left}
.crow .ttl:hover{text-decoration:underline;text-underline-offset:3px}
.crow .meta{font-size:13.5px;color:var(--body);margin-top:3px}
.crow .why{font-size:14.5px;color:var(--body);margin-top:3px}
.crow .fit{text-align:center;flex:none;width:56px}
.crow .fit b{display:block;font:700 22px/1 var(--head);color:var(--teal-dark)}
.crow .fit small{font-size:12px;color:var(--muted)}
.tryfirst{background:var(--peach);color:var(--peach-text);font:700 12px var(--text);border-radius:999px;padding:3px 10px;white-space:nowrap}
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.search .field{max-width:340px}
.savedpill{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--teal-dark);border-radius:999px;padding:8px 16px;font:700 14px var(--text);text-decoration:none}

/* plan */
.plan-grid{display:grid;grid-template-columns:300px repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.pcol{padding:22px}
.pcol .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pcol .head h2{font-size:24px;white-space:nowrap}
.pcol .head .chip{white-space:nowrap}
.cred{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:13px;color:var(--muted)}
.cred b{font:700 18px var(--head);color:var(--navy)}
.cls{background:var(--paper);border-radius:14px;padding:12px 14px;margin-top:10px;position:relative}
.cls[draggable="true"]{cursor:grab}
.cls.dragging{opacity:.45}
.cls b.t{display:block;font:600 15px/1.3 var(--text);color:var(--navy)}
.cls .m{font-size:13px;color:var(--body);margin:2px 0 6px}
.cls .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cls.warn{background:#FFF7ED}
.cls .warnline{font-size:13px;color:var(--peach-text);display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.cls.new{background:#fff;border:2px solid var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.12)}
.cls .grip{position:absolute;left:4px;top:14px;color:#9CA3AF}
.cls.has-grip{padding-left:26px}
.dropzone{border:2px dashed #C9C6BE;border-radius:14px;padding:22px 12px;text-align:center;margin-top:10px;color:var(--navy);font-weight:600;font-size:14px;transition:background .12s,border-color .12s}
.dropzone.over{border-color:var(--teal);background:var(--banner);color:var(--teal-dark)}
.sched li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px;color:var(--navy);font-weight:500}
.sched li:last-child{border:0}
.sched li span{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
.okline{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--teal-dark);margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.okline.bad{color:var(--peach-text)}
.okline svg{flex:none;margin-top:2px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sugg button{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--navy);background:#fff;color:var(--navy);border-radius:999px;font:600 13px var(--text);padding:5px 12px;min-height:34px}
.sugg button:hover{background:var(--select)}
.explore{margin-top:22px;padding:28px 32px}

/* review */
.rev-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:24px;align-items:start}
.rail{padding:22px}
.rcard{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px}
.rcard.on{background:var(--select);border-color:var(--navy);border-width:2px}
.rcard b{display:block;flex-basis:100%;font:600 15px/1.3 var(--text);color:var(--navy)}
.rcard .m{font-size:13px;color:var(--body);margin:2px 0 6px}
.rcard .chip{margin-bottom:4px}
.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 26px}
.react{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:2px solid var(--border);border-radius:16px;background:#fff;text-align:center;color:var(--navy)}
.react b{font:700 17px var(--head)}
.react span.s{font-size:13px;color:var(--body)}
.react[aria-pressed="true"]{border-color:var(--navy);background:var(--select)}
.react .tick{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:none;place-items:center}
.react[aria-pressed="true"] .tick{display:grid}
.tagrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 26px}
.tg{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;font:600 14.5px var(--text);padding:9px 16px;min-height:44px}
.tg[aria-pressed="true"]{background:var(--select);border-color:var(--navy)}
.scale{display:flex;gap:10px;margin:12px 0 4px}
.scale button{width:48px;height:48px;border-radius:50%;border:2px solid #9CA3AF;background:#fff;color:var(--navy);font:700 17px var(--head)}
.scale button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.scale-l{display:flex;justify-content:space-between;max-width:270px;font-size:12.5px;color:var(--muted);margin-bottom:26px}
.seg{display:inline-flex;border:2px solid var(--navy);border-radius:12px;overflow:hidden;margin:12px 0 26px}
.seg button{border:0;background:#fff;color:var(--navy);font:600 15px var(--text);min-width:96px;min-height:44px;padding:0 18px}
.seg button+button{border-left:2px solid var(--navy)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.q-h{font:700 17px var(--head);color:var(--navy)}
.q-h small{font:400 14px var(--text);color:var(--muted);margin-left:8px}
.delta{display:inline-flex;font:700 12px var(--text);padding:2px 9px;border-radius:999px}
.delta.up{background:var(--mint);color:var(--teal-dark)}
.delta.down{background:var(--peach);color:var(--peach-text)}
.delta.same{background:#F3F4F6;color:var(--body)}
.navy-card{background:var(--navy);border-radius:24px;padding:24px;color:var(--on-navy);box-shadow:0 14px 34px rgba(27,42,107,.28)}
.navy-card .sub{color:var(--aqua)}
.navy-card h3{color:#fff;font-size:26px;line-height:1.15;margin:12px 0 16px}
.navy-card .it{background:var(--row);border-radius:12px;padding:12px 14px;margin-top:10px;color:#fff}
.navy-card .it b{display:block;font:600 15px var(--text)}
.navy-card .it small{display:block;font-size:13px;color:var(--on-navy);margin-top:2px}
.navy-card .it .nums{display:flex;gap:8px;align-items:center;margin-top:4px;font-weight:600}
.navy-card p.n{font-size:13.5px;margin-top:12px}

/* my path */
.path-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:stretch}
.road-card{background:var(--navy);border-radius:28px;padding:28px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.road-card .sub{color:var(--aqua)}
.road-wrap{position:relative;margin:auto 0;width:100%;aspect-ratio:640/340}
.road-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center}
.node .dot{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--road);margin:0 auto;display:grid;place-items:center;color:var(--navy)}
.node.done .dot{background:var(--aqua);border-color:var(--aqua)}
.node.cur .dot{background:#fff;border-color:var(--orange);box-shadow:0 0 0 6px rgba(249,115,22,.28)}
.node.end .dot{background:var(--orange);border-color:var(--orange);width:30px;height:30px;color:var(--navy)}
.node .lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 13px var(--text);color:#fff;text-align:center}
.node .lbl small{display:block;font-weight:400;font-size:11.5px;color:var(--on-navy)}
.node.above .lbl{bottom:34px}
.node.below .lbl{top:34px}
.node a{text-decoration:none}
.prog li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:15px;color:var(--navy)}
.prog li:last-child{border:0}
.prog .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--border);color:transparent}
.prog li.done .st{background:var(--mint);border-color:var(--mint);color:var(--teal-dark)}
.prog li.done span.l{color:var(--body)}
.prog li a,.prog li button.l{margin-left:auto;font-size:13.5px}
.successbar{background:var(--banner);border:1px solid #99F6E4;border-radius:18px;padding:16px 20px;color:var(--navy);display:flex;gap:12px;align-items:center;margin:22px 0}
.successbar svg{color:var(--teal-dark);flex:none}
.moved .mrow{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.moved .mrow:last-child{border:0}
.moved .mrow b{font:600 16px var(--text);color:var(--navy);display:block}
.moved .mrow small{font-size:13px;color:var(--body)}
.moved .nums{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--navy)}
.focuscard{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* share + about */
.share-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.sharebox{white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);border-radius:16px;padding:20px;color:var(--navy);max-height:560px;overflow:auto}
.prose{max-width:820px}
.prose h2{font-size:28px;margin:44px 0 12px}
.prose h3{font-size:20px;margin:26px 0 8px}
.prose p+p,.prose ul+p,.prose p+ul{margin-top:12px}
.prose ul.bul li{position:relative;padding:3px 0 3px 22px}
.prose ul.bul li::before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff;border-radius:16px;overflow:hidden;margin-top:12px}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.tbl th{font:700 12px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark);background:#fff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:#fff}
.tbl-wrap .tbl{margin:0}
.tbl-wrap .tbl tr:last-child td{border-bottom:0}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.lock-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.lock-list li:last-child{border:0}
.lock-list svg{flex:none;color:var(--orange-ink);margin-top:3px}

/* print */
@media print{
  .nav,.foot,.banner-top,.toasts,.no-print,.skip{display:none!important}
  body{background:#fff}
  .page{padding:0}
  .card{box-shadow:none;border:0}
  .sharebox{max-height:none;background:#fff;padding:0}
  .share-grid{display:block}
  .share-grid .controls{display:none}
}

/* responsive */
@media (max-width:1180px){
  .wrap{padding-left:32px;padding-right:32px}
  .plan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-grid>.pcol:first-child{grid-column:1/-1}
  .rev-grid{grid-template-columns:230px minmax(0,1fr)}
  .rev-grid>.side{grid-column:1/-1}
  .maj-grid{grid-template-columns:repeat(4,1fr)}
  .nav-links a{padding:9px 11px}
}
@media (max-width:980px){
  .hero,.react-demo,.consent-grid,.cols2,.path-top,.share-grid{grid-template-columns:1fr}
  .hero{gap:36px;padding-top:36px}
  .hero .h1{font-size:46px}
  .stats .wrap{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .maj-grid{grid-template-columns:repeat(3,1fr)}
  .quiz-grid,.cols-c{grid-template-columns:1fr}
  .cols3{grid-template-columns:1fr;gap:26px}
  .opts{grid-template-columns:1fr 1fr}
  .rank-grid,.two{grid-template-columns:1fr}
  .rev-grid{grid-template-columns:1fr}
  .nav-links{display:none;position:absolute;left:0;right:0;top:64px;background:#fff;border-bottom:1px solid var(--border);flex-direction:column;align-items:stretch;padding:10px 20px 18px;gap:4px;box-shadow:0 16px 30px rgba(27,42,107,.12)}
  .nav-links.open{display:flex}
  .nav-links a{padding:13px 16px;font-size:16px}
  .menu-btn{display:inline-flex}
  .h1{font-size:40px}
}
@media (max-width:640px){
  .wrap{padding-left:18px;padding-right:18px}
  .page{padding-top:28px;padding-bottom:64px}
  .h1,.hero .h1{font-size:34px}
  .h2{font-size:26px}
  .q-title{font-size:26px}
  .lede{font-size:16.5px}
  .pad{padding:20px}
  .hero-card-p{padding:22px 20px}
  .hero-art{aspect-ratio:auto;min-height:430px}
  .hero-card{padding:12px 14px}
  .hero-card.a{top:6%;left:5%;width:58%}
  .hero-card.b{bottom:5%;right:5%;width:72%}
  .stats b{font-size:38px}
  .steps,.maj-grid{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .opt{min-height:0}
  .plan-grid{grid-template-columns:1fr}
  .reacts{grid-template-columns:1fr}
  .crow{flex-wrap:wrap}
  .crow .fit{order:3}
  .cta-band{padding:28px 22px}
  .cta-band h2{font-size:28px}
  .score{font-size:46px}
  .btn{white-space:normal;text-align:center}
  .actions .grow{text-align:left;flex-basis:100%}
  .node .lbl{font-size:11px}
  .node .lbl small{display:none}
  .road-card{padding:18px}
  .brand .proto{display:none}
  .modal{padding:22px}
  .foot .wrap{flex-direction:column;align-items:flex-start}
}

.modal:focus{outline:none}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

<script>
(function () {

/* Reads one class per line. Understands "CS 1110, Intro to Programming, 3", "CS 1110 Intro to Programming (3 credits)" and bare codes. */
function parseCatalogText(text) {
  const lines = String(text || '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean).slice(0, 3000);
  const items = [];
  const seen = {};
  let unreadable = 0;
  let duplicates = 0;
  const bad = [];
  lines.forEach((line) => {
    const m = line.match(/\b([A-Za-z]{2,5})\s*-?\s*(\d{4})([A-Za-z]?)\b/);
    if (!m) { unreadable += 1; if (bad.length < 4) bad.push(line.slice(0, 60)); return; }
    const code = m[1].toUpperCase() + ' ' + m[2] + (m[3] || '').toUpperCase();
    if (seen[code]) { duplicates += 1; return; }
    seen[code] = true;
    let rest = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length)).trim();
    let credits = null;
    const cm = rest.match(/(?:[,;\t|]\s*|\(|\s)(\d(?:\.\d)?)\s*(?:credits?|cr|units?|hrs?)?\)?\s*$/i);
    if (cm) {
      const n = parseFloat(cm[1]);
      if (n >= 1 && n <= 6) { credits = n; rest = rest.slice(0, cm.index); }
    }
    const title = rest.replace(/^[\s,;:|\-–—\t"]+|[\s,;:|\-–—\t"]+$/g, '').replace(/\s{2,}/g, ' ');
    items.push(mergeUploaded(code, title, credits));
  });

function suggestTerm(st, code) {

  return r.order.slice(0, 5).map((id, i) => {
    const now = r.scores[id];
    const was = st.baseline.scores[id];
    const wasRank = rankOf(st.baseline.order, id);
    const delta = now - was;
    let note = 'Still #' + (i + 1);

}

}

}

  const f = termReviewStats(st, 'f26');
  const s = termReviewStats(st, 's27');
  const fDone = !!st.plan.taken.f26 && f.total > 0 && f.reviewed === f.total;
  const sDone = !!st.plan.taken.s27 && s.total > 0 && s.reviewed === s.total;
  const fid = focusId(st);
  const nodes = [
    { id: 'quiz', label: 'Quiz', sub: st.quizDone ? 'Done' : 'Not started', done: !!st.quizDone, x: 9.375, y: 73.53, above: false },
    { id: 'paths', label: 'Paths', sub: st.viewedPaths ? 'Done' : 'Not seen yet', done: !!st.viewedPaths, x: 28.125, y: 44.12, above: true },
    { id: 'f26', label: 'Fall 2026', sub: st.plan.taken.f26 ? f.reviewed + ' of ' + f.total + ' reviewed' : f.total ? 'Planned · ' + f.credits + ' credits' : 'Not planned yet', done: fDone, x: 48.44, y: 67.65, above: false },
    { id: 's27', label: 'Spring 2027', sub: st.plan.taken.s27 ? s.reviewed + ' of ' + s.total + ' reviewed' : s.total ? 'Planning · ' + s.credits + ' credits' : 'Not planned yet', done: sDone, x: 70.31, y: 41.18, above: true },

/* ---------- summary for sharing ---------- */
function summarySections(st, inc) {
  const out = [];
  const r = rankMajors(st);
  if (inc.paths && r.has) {
    const lines = [];
    r.order.slice(0, 3).forEach((id, i) => {
      lines.push((i + 1) + '. ' + MAJOR_BY_ID[id].name + ': overlap ' + r.scores[id] + '% (illustrative, not a prediction)');
      evidenceFor(st, id).filter((e) => !isFlagged(st, id, e.id)).slice(0, 2).forEach((e) => lines.push('   Why: ' + evidenceText(e)));
      uncertaintyFor(st, id, r).slice(0, 1).forEach((u) => lines.push('   Less sure: ' + u));
    });
    const ch = Object.keys(st.challenges || {});
    ch.forEach((id) => {
      const c = st.challenges[id];
      const label = { nofit: 'Set aside (does not fit me)', reason: 'Reason flagged as wrong', unsure: 'Not sure yet', explore: 'Pinned to explore anyway' }[c.kind];
      lines.push('Challenge: ' + MAJOR_BY_ID[id].name + ' - ' + label + (c.note ? ' - ' + c.note : ''));
    });
    out.push({ title: 'Possible paths to explore', lines });
  }
  if (inc.plan) {
    const lines = [];
    TERMS.forEach((t) => {
      const codes = st.saved.filter((c) => st.plan.placed[c] === t.id);
      if (!codes.length) return;
      lines.push(t.label + ' (' + termCredits(st, t.id) + ' credits' + (st.plan.taken[t.id] ? ', taken' : '') + '): ' + codes.map((c) => c + ' ' + titleOf(st, c)).join('; '));
    });
    const un = st.saved.filter((c) => !st.plan.placed[c]);
    if (un.length) lines.push('Saved, not scheduled: ' + un.map((c) => c + ' ' + titleOf(st, c)).join('; '));
    if (lines.length) out.push({ title: 'Plan', lines });
  }
  if (inc.reviews) {
    const lines = Object.keys(st.reviews).map((code) => {
      const rv = st.reviews[code];
      return code + ' ' + titleOf(st, code) + ': ' + (REACTION_BY_ID[rv.reaction] ? REACTION_BY_ID[rv.reaction].label : 'reviewed') + (rv.note ? ' - ' + rv.note : '');
    });
    if (lines.length) out.push({ title: 'Class reviews', lines });
  }
  if (inc.reflect) {
    const lines = [];
    REFLECT_PROMPTS.forEach((p) => { if ((st.reflect[p.id] || '').trim()) lines.push(p.label + ': ' + st.reflect[p.id].trim()); });
    if (lines.length) out.push({ title: 'My reflections', lines });
  }
  if (inc.log && st.log.length) {
    out.push({ title: 'Decisions so far', lines: st.log.slice(-12).map((l) => new Date(l.ts).toLocaleDateString() + ': ' + l.text) });
  }
  return out;
}
function summaryText(st, inc) {
  const parts = ['Pathwise summary (prototype). Scores are illustrative and are not predictions. Generated ' + new Date().toLocaleDateString() + '.'];
  summarySections(st, inc).forEach((s) => { parts.push(''); parts.push(s.title.toUpperCase()); s.lines.forEach((l) => parts.push(l)); });
  return parts.join('\n');
}

/* Never trust stored data: rebuild every field from what is valid. */
function sanitize(raw) {
  const d = defaultState();

  d.consent = raw.consent === true;

  d.focusChosen = raw.focusChosen === true;

    const ids = a.filter((x, i) => typeof x === 'string' && q.opts.some((o) => o.id === x) && a.indexOf(x) === i).slice(0, q.max);
    if (ids.length) d.answers[q.id] = ids;

  });

  const rawCustom = raw.custom && typeof raw.custom === 'object' ? raw.custom : {};

    const v = rawCustom[code];
    if (!isStr(code, 14) || CLASS_BY_CODE[code] || !v || typeof v !== 'object') return;
    d.custom[code] = mergeUploaded(code, isStr(v.title, 120) ? v.title : code, Number(v.credits) || 3);
  });
  const rc = raw.catalog;
  if (rc && rc.mode === 'upload' && Array.isArray(rc.items) && rc.items.length && rc.items.length <= 3000) {
    const items = [];
    rc.items.forEach((it) => {
      if (it && isStr(it.code, 14)) items.push(mergeUploaded(it.code, isStr(it.title, 120) ? it.title : it.code, Number(it.credits) || 3));
    });
    if (items.length) {
      const s = rc.stats && typeof rc.stats === 'object' ? rc.stats : {};
      d.catalog = { mode: 'upload', name: isStr(rc.name, 80) ? rc.name : 'Your list', items, stats: {
        lines: Number(s.lines) || items.length, read: items.length, recognized: items.filter((i) => i.recognized).length,
        unreadable: Number(s.unreadable) || 0, duplicates: Number(s.duplicates) || 0, bad: Array.isArray(s.bad) ? s.bad.filter((x) => isStr(x, 80)).slice(0, 4) : []

  }
  const okCode = (c) => typeof c === 'string' && !!classInfo(d, c);
  d.saved = Array.isArray(raw.saved) ? raw.saved.filter((c, i, a) => okCode(c) && a.indexOf(c) === i).slice(0, 200) : [];
  const rp = raw.plan && typeof raw.plan === 'object' ? raw.plan : {};
  d.saved.forEach((c) => { if (rp.placed && TERM_IDS.indexOf(rp.placed[c]) >= 0) d.plan.placed[c] = rp.placed[c]; });
  TERM_IDS.forEach((t) => { if (rp.taken && rp.taken[t] === true) d.plan.taken[t] = true; });
  const rr = raw.reviews && typeof raw.reviews === 'object' ? raw.reviews : {};
  Object.keys(rr).slice(0, 200).forEach((code) => {
    const v = rr[code];
    if (!okCode(code) || !v || !REACTION_BY_ID[v.reaction]) return;
    d.reviews[code] = {
      reaction: v.reaction,
      enjoy: Array.isArray(v.enjoy) ? v.enjoy.filter((t, i, a) => TAG_BY_ID[t] && a.indexOf(t) === i) : [],
      expect: Number.isInteger(v.expect) && v.expect >= 1 && v.expect <= 5 ? v.expect : null,

  });
  const rch = raw.challenges && typeof raw.challenges === 'object' ? raw.challenges : {};
  Object.keys(rch).forEach((id) => {
    const v = rch[id];
    if (!MAJOR_BY_ID[id] || !v || CHALLENGE_KINDS.indexOf(v.kind) < 0) return;
    d.challenges[id] = {
      kind: v.kind, note: isStr(v.note, 300) ? v.note : '',
      flagged: Array.isArray(v.flagged) ? v.flagged.filter((x) => isStr(x, 80)).slice(0, 12) : [], ts: Number(v.ts) || 0

  });
  d.focus = MAJOR_BY_ID[raw.focus] ? raw.focus : null;
  if (!d.focus) d.focusChosen = false;

    <div class="secchips" aria-label="Quiz sections">${SECTIONS.map((s, i) => h`<span class="secchip ${i < secIdx ? 'done' : i === secIdx ? 'now' : ''}" ${i === secIdx ? raw('aria-current="step"') : ''}>${i < secIdx ? icon('check', 14) : ''}${s.label}</span>`)}</div>
    <div class="quiz-grid">
      <div class="card pad">
        <h1 class="q-title" id="page-title" tabindex="-1">${q.title}</h1>
        <p class="note">Pick up to ${q.max}. <span class="picked" aria-live="polite">${picks.length} of ${q.max} picked</span></p>
        <div class="opts" role="group" aria-label="${q.title}">${q.opts.map((o) => {
          const on = picks.indexOf(o.id) >= 0;
          return h`<button type="button" class="opt" data-act="pick" data-arg="${o.id}" aria-pressed="${on ? 'true' : 'false'}">${tile(o.icon, SECTION_BY_ID[q.sec].tile, '#1B2A6B')}<b>${o.title}</b><span class="s">${o.sub}</span><span class="tick">${icon('check', 14)}</span></button>`;
        })}</div>
        <div class="why-box"><b>Why we ask</b>${q.why}</div>
        ${hint ? h`<p class="err" role="alert">${icon('alert', 18)}${hint}</p>` : ''}
        <div class="q-foot" style="margin-top:20px">
          <button class="btn btn-secondary btn-sm" type="button" data-act="qBack" ${qi === 0 ? raw('disabled') : ''}>${icon('arrowLeft', 18)}Back</button>
          <button class="link-btn" type="button" data-act="qSkip">Skip this question</button>
          <span class="grow"></span>
          <button class="btn btn-primary" type="button" data-act="qNext">${last ? 'See my paths' : 'Next'} ${icon('arrow', 20)}</button>
        </div>
      </div>
      ${quizSidebar()}
    </div>
  </div>`;
}

/* ===== views_b.js: Paths (flow 3), Major page, Compare, Challenge ===== */
function rolesBlock(id, m, max) {
  const exp = U.expandRoles[id];
  const list = exp ? m.careers : m.careers.slice(0, max || 4);
  const more = m.careers.length - list.length;
  return h`<div class="chips">${list.map((c) => chip(c))}${more > 0 ? h`<button type="button" class="chip chip-plain" data-act="roles" data-arg="${id}">+${more} more</button>` : ''}</div><p class="note" style="margin-top:8px">Roles people often explore with this major. Not a promise of jobs.</p>`;
}
function starterList(m, limit) {
  return h`<div class="start-list">${m.starter.slice(0, limit || 3).map((code) => {
    const c = infoOrStub(S, code);
    return h`<button type="button" class="start" data-act="classOpen" data-arg="${code}">${classTile(c)}<span><b>${c.title}</b><span class="s">${levelLabel(c.level)} · ${prereqText(S, c)}</span></span></button>`;
  })}</div>`;
}
function statusChips(id) {
  const c = S.challenges[id];
  if (!c) return '';
  const map = { unsure: ['Not sure yet', 'chip-indigo'], explore: ['Pinned by you', 'chip-peach'], reason: ['Reason flagged', 'chip-peach'], nofit: ['Set aside by you', 'chip-plain'] };
  return chip(map[c.kind][0], map[c.kind][1] + ' chip-sm');
}
function evLine(id, e) {
  const fl = isFlagged(S, id, e.id);
  let fix = '';
  if (fl && e.kind === 'quiz' && e.qids && e.qids.length) fix = h`<button class="flagbtn no-print" type="button" data-act="editAnswer" data-arg="${e.qids[0]}">Change that answer</button>`;
  if (fl && e.kind === 'review' && !S.testMode) fix = h`<button class="flagbtn no-print" type="button" data-act="reviewOpen" data-arg="${e.code}">Change that review</button>`;
  return h`<li class="${fl ? 'flagged' : ''}"><span class="ck ${fl ? 'flag' : ''}">${icon(fl ? 'flag' : 'check', 14)}</span><div><span class="tx">${evidenceText(e)}</span>${fl ? h` <span class="sr-only">(flagged as wrong)</span>` : ''}<br><span class="from">From: ${e.from.join(', ')}</span> <button class="flagbtn no-print" type="button" data-act="flagEv" data-arg="${id + '|' + e.id}">${fl ? 'Undo: this is right' : 'This looks wrong'}</button> ${fix}</div></li>`;
}
function evidenceBlock(id, limit) {
  const items = evidenceFor(S, id).slice(0, limit || 6);
  if (!items.length) return h`<p class="note">Not enough answers yet to point to specific reasons.</p>`;
  return h`<ul class="why">${items.map((e) => evLine(id, e))}</ul>`;
}
function lessSure(id, rk) {
  const u = uncertaintyFor(S, id, rk);
  u.push('Pathwise ignores grades, course load, admissions and job outcomes.');
  return h`<ul class="why less">${u.map((t) => h`<li><span class="ck q">${icon('info', 14)}</span><span>${t}</span></li>`)}</ul>`;
}
function mixDetails(id) {
  const p = shareOf(profileVec(S));
  if (!p) return '';
  const q = MAJOR_SHARE[id];
  const total = Math.round(100 * overlapOf(p, q));
  const mx = Math.max.apply(null, DIM_IDS.map((d) => Math.max(p[d], q[d])));
  const m = MAJOR_BY_ID[id];
  return h`<details class="how"><summary>${icon('chevronDown', 18)}Show how this was worked out</summary>
    <p class="small" style="margin-top:10px">Your answers add up to a mix of six interest signals. ${m.name} has its own typical mix, written by the team as a sample. For each signal we keep the smaller of the two shares, then add them up.</p>
    <table class="mixtbl"><caption class="sr-only">Your mix compared with ${m.name}</caption><thead><tr><th scope="col">Signal</th><th scope="col">You and ${m.name}</th><th scope="col">Shared</th></tr></thead>
    <tbody>${DIMS.map((d) => h`<tr><th scope="row">${d.label}</th><td><div class="bars">${bar((p[d.id] / mx) * 100, 'sm navy', 'You: ' + d.label)}${bar((q[d.id] / mx) * 100, 'sm', m.name + ': ' + d.label)}</div></td><td>${Math.round(Math.min(p[d.id], q[d.id]) * 100)}%</td></tr>`)}</tbody></table>
    <div class="legend"><span><i style="background:#1B2A6B"></i>You</span><span><i style="background:#14B8A6"></i>${m.name}</span></div>
    <p class="small" style="margin-top:10px"><b class="bold">Add up the “Shared” column: about ${total}%.</b> That is the overlap score. It is illustrative: the major mixes are hand-set by the team and have not been validated.</p></details>`;
}
function logPanel(n) {
  const items = S.log.slice(-n).reverse();
  return h`<div class="card pad" style="margin-top:24px"><h2 class="h3" style="margin-bottom:6px">Your decisions so far</h2>${items.length ? h`<ul class="log">${items.map((l) => h`<li><time>${fmtDate(l.ts)}</time><span>${l.text}</span></li>`)}</ul>` : h`<p class="note">Nothing yet. When you set aside, flag or pin a path, it is listed here.</p>`}</div>`;
}

function topCard(id, rk) {
  const m = MAJOR_BY_ID[id];
  const sc = rk.scores[id];
  const full = !S.testMode;
  const isFocus = S.focusChosen && S.focus === id;
  return h`<section class="card hero-card-p" aria-labelledby="top-name">
    <div class="row between"><span class="top-badge">${rk.pinned.indexOf(id) >= 0 ? '#1 Pinned by you' : '#1 Highest overlap'}</span><span class="tag-ex">Illustrative</span></div>
    <div class="cols3">
      <div>${majorTile(m, 'lg')}<h2 id="top-name" class="h2" style="margin:16px 0 8px">${m.name}</h2><p>${m.tag}</p>
        <div style="display:flex;align-items:baseline;gap:10px;margin:18px 0 12px"><span class="score">${sc}%</span><span>overlap</span></div>${bar(sc, '', 'Overlap with ' + m.name)}
        <p class="note" style="margin-top:8px">${bandOf(sc)} · not a prediction</p><div class="chips" style="margin-top:10px">${statusChips(id)}${isFocus ? chip('Your focus', 'chip-mint chip-sm') : ''}</div></div>
      <div><p class="sub">Why it's suggested</p>${evidenceBlock(id)}<p class="sub o" style="margin-top:18px">What we're less sure about</p>${lessSure(id, rk)}</div>
      <div><p class="sub">Roles people often explore</p>${rolesBlock(id, m)}<p class="sub" style="margin:22px 0 10px">Starter classes</p>${starterList(m)}</div>
    </div>
    ${mixDetails(id)}
    <div class="actions no-print">
      ${full ? h`<button class="btn btn-primary" type="button" data-act="goCourses" data-arg="${id}">Pick classes to try ${icon('arrow', 20)}</button>` : h`<button class="btn btn-primary" type="button" data-act="challengeOpen" data-arg="${id}">${icon('flag', 18)}Challenge this suggestion</button>`}
      ${full ? h`<button class="btn btn-secondary" type="button" data-act="challengeOpen" data-arg="${id}">${icon('flag', 18)}Challenge this</button>` : ''}
      ${full && !isFocus ? h`<button class="btn btn-secondary" type="button" data-act="focusSet" data-arg="${id}">Make this my focus</button>` : ''}
      <button class="btn btn-secondary" type="button" data-act="compareTop">Compare my top 3</button>
      <span class="grow note">Paths update every time you change an answer${full ? ' or react to a class' : ''}.</span>
    </div></section>`;
}
function midCard(id, rank, rk) {
  const m = MAJOR_BY_ID[id];
  const sc = rk.scores[id];
  const full = !S.testMode;
  const ev = evidenceFor(S, id).slice(0, 2);
  return h`<article class="card card-mid" aria-label="${m.name}">
    <div class="head"><div class="row" style="flex-wrap:nowrap;gap:14px">${majorTile(m, 'lg')}<div><p class="eyebrow" style="font-size:11px">${rk.pinned.indexOf(id) >= 0 ? '#' + rank + ' · Pinned' : '#' + rank + ' overlap'}</p><h2 class="name">${m.name}</h2></div></div><span class="score md">${sc}%</span></div>
    <div style="margin:14px 0 4px">${bar(sc, '', 'Overlap with ' + m.name)}</div>
    <div class="chips" style="margin:10px 0 0">${statusChips(id)}</div>
    <p class="sub" style="margin:16px 0 4px">Why it's suggested</p>${ev.length ? h`<ul class="why">${ev.map((e) => evLine(id, e))}</ul>` : h`<p class="note">Not enough answers yet to point to specific reasons.</p>`}
    <p class="sub" style="margin:14px 0 10px">Roles people often explore</p>${rolesBlock(id, m, 3)}
    <p style="margin-top:14px;font-size:15px">Start with ${m.starter.slice(0, 2).map((c) => titleOf(S, c)).join(' and ')}.</p>
    <div class="row no-print" style="margin-top:16px">${full ? h`<button class="btn btn-secondary btn-sm" type="button" data-act="goCourses" data-arg="${id}">See classes</button>` : ''}<a class="btn btn-secondary btn-sm" href="#/paths/${id}">Details</a><button class="btn btn-secondary btn-sm" type="button" data-act="challengeOpen" data-arg="${id}">${icon('flag', 16)}Challenge</button></div>
  </article>`;
}

function viewPaths() {
  const rk = rankMajors(S);
  const n = answeredCount(S);
  if (!rk.has) {
    return h`<div class="wrap page">${flowSteps(3)}${pageHead({ eyebrow: 'Step 3 · Options and reasons', title: 'Your paths show up', accent: 'after the quiz.', lede: 'Answer a few questions first. Pathwise then shows possible majors, why each was suggested, and how you can push back.' })}
      <div class="card empty"><h2 class="h3">Nothing to show yet</h2><p>Pathwise has no answers to work from.</p><div class="row" style="justify-content:center"><a class="btn btn-primary" href="${S.consent ? '#/quiz' : '#/consent'}">${S.consent ? 'Go to the quiz' : 'Start with consent'} ${icon('arrow', 20)}</a></div></div></div>`;
  }
  const top = rk.order.slice(0, 3);
  const rest = rk.order.slice(3);
  const sig = topSignals(S, 3);
  const chipCls = ['chip-mint', 'chip-indigo', 'chip-peach'];
  return h`<div class="wrap page">${flowSteps(3)}
    ${pageHead({ eyebrow: 'Step 3 · Your paths · based on ' + (S.quizDone ? 'your ' + n : n + ' of ' + QUESTIONS.length) + ' answers', title: 'Three majors that overlap with', accent: 'what you already do.', lede: 'Overlap shows how closely each major’s typical mix of interests matches yours. It is a starting point for exploring, not a verdict or a prediction, and grades are not part of it.', actions: h`<button class="btn btn-secondary" type="button" data-act="qEdit">Change my answers</button>` })}
    ${!S.quizDone ? h`<div class="callout peach" style="margin-bottom:20px">${icon('info', 18)}<span>You have not finished the quiz, so these paths use only the ${n} answers so far. <a href="#/quiz">Continue the quiz</a></span></div>` : ''}
    <div class="noticed"><b class="bold">What we noticed in your answers</b>${sig.map((s, i) => chip(s.dim.label, chipCls[i % 3]))}</div>
    ${top.length ? topCard(top[0], rk) : ''}
    <div class="two">${top.slice(1).map((id, i) => midCard(id, i + 2, rk))}</div>
    ${rest.length ? h`<section class="card pad" style="margin-top:24px" aria-labelledby="all-ranked"><div class="row between" style="align-items:flex-end"><h2 class="h2" id="all-ranked" style="font-size:28px">All ${rk.order.length} majors, ranked</h2><p class="note" style="max-width:360px">The top 3 are above. Tap any other major to peek at its details.</p></div>
      <div class="rank-grid">${rest.map((id, i) => { const m = MAJOR_BY_ID[id]; return h`<a class="rrow" href="#/paths/${id}"><span class="n">${i + 4}</span>${majorTile(m, 'sm')}<span class="mid"><b>${m.name} ${statusChips(id)}</b>${bar(rk.scores[id], 'sm', 'Overlap with ' + m.name)}</span><span class="p">${rk.scores[id]}%</span></a>`; })}</div></section>` : ''}
    ${rk.aside.length ? h`<section class="card pad" style="margin-top:24px"><h2 class="h3" style="margin-bottom:6px">Set aside by you</h2><p class="note">These are hidden from your ranking. Bring one back any time.</p><ul class="log">${rk.aside.map((id) => h`<li><span style="flex:1"><b class="bold">${MAJOR_BY_ID[id].name}</b> · ${rk.scores[id]}% overlap${S.challenges[id].note ? h` · “${S.challenges[id].note}”` : ''}</span><button class="btn btn-secondary btn-xs" type="button" data-act="restore" data-arg="${id}">Bring it back</button></li>`)}</ul></section>` : ''}
    ${logPanel(6)}
  </div>`;
}

/* ---------- one major ---------- */
function viewMajor(id) {
  const m = MAJOR_BY_ID[id];
  if (!m) return view404();
  const rk = rankMajors(S);
  const full = !S.testMode;
  const inCmp = compareIds().indexOf(id) >= 0;
  const aside = rk.aside.indexOf(id) >= 0;
  const isFocus = S.focusChosen && S.focus === id;
  return h`<div class="wrap page">
    <a class="back" href="#/paths">${icon('arrowLeft', 16)}All paths</a>
    <div class="major-head">${majorTile(m, 'lg')}<div><p class="eyebrow">Major</p><h1 class="h1" id="page-title" tabindex="-1" style="font-size:40px">${m.name}</h1><p style="margin-top:4px">${m.tag}</p><div class="chips" style="margin-top:10px">${statusChips(id)}${isFocus ? chip('Your focus', 'chip-mint chip-sm') : ''}</div></div></div>
    <div class="cols2">
      <div class="stack">
        <section class="card pad"><h2 class="h3" style="margin-bottom:8px">What it's like</h2><p>${m.about}</p></section>
        <section class="card pad" aria-labelledby="ov-h"><div class="row between"><h2 class="h3" id="ov-h">Overlap with your interests</h2><span class="tag-ex">Illustrative</span></div>
          ${rk.has ? h`<div style="display:flex;align-items:baseline;gap:10px;margin:14px 0 10px"><span class="score md">${rk.scores[id]}%</span><span>${aside ? 'overlap (set aside by you)' : bandOf(rk.scores[id]).toLowerCase() + ', not a prediction'}</span></div>${bar(rk.scores[id], '', 'Overlap')}
            <p class="sub" style="margin-top:20px">Why it's suggested</p>${evidenceBlock(id)}<p class="sub o" style="margin-top:16px">What we're less sure about</p>${lessSure(id, rk)}${mixDetails(id)}`
            : h`<p style="margin:10px 0 16px">Take the quiz to see how this major overlaps with your interests, and why.</p><a class="btn btn-secondary" href="${S.consent ? '#/quiz' : '#/consent'}">${S.consent ? 'Go to the quiz' : 'Start with consent'}</a>`}</section>
        <section class="card pad"><h2 class="h3" style="margin-bottom:12px">Try it before you commit</h2>
          <div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px">${tile('wrench', '#FFEDD5', '#9A3412')}<div><b class="bold">A small project</b><p>${m.tryProject}</p></div></div>
          <div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px;margin-top:16px">${tile('chat', '#E0E7FF', '#1B2A6B')}<div><b class="bold">A conversation to have</b><p>${m.tryChat}</p></div></div>
          <p class="note" style="margin-top:14px">Pathwise does not contact anyone for you. If you want to reach out, do it yourself.</p></section>
      </div>
      <div class="stack">
        <section class="card pad-sm"><h2 class="h3" style="font-size:18px;margin-bottom:12px">Starter classes</h2>${starterList(m, 4)}<p class="note" style="margin-top:10px">Sample classes, not an official course list.</p></section>
        <section class="card pad-sm"><h2 class="h3" style="font-size:18px;margin-bottom:12px">Roles people often explore</h2>${rolesBlock(id, m, 6)}</section>
        <section class="card pad-sm no-print"><div class="stack">
          ${full ? h`<button class="btn btn-primary" type="button" data-act="goCourses" data-arg="${id}" style="width:100%">Pick classes to try ${icon('arrow', 20)}</button>` : h`<a class="btn btn-primary" href="${rk.has ? '#/paths' : (S.consent ? '#/quiz' : '#/consent')}" style="width:100%">${rk.has ? 'Back to my paths' : 'Take the quiz'}</a>`}
          ${rk.has ? h`<button class="btn btn-secondary" type="button" data-act="challengeOpen" data-arg="${id}" style="width:100%">${icon('flag', 18)}Challenge this</button>` : ''}
          ${full && rk.has && !isFocus ? h`<button class="btn btn-secondary" type="button" data-act="focusSet" data-arg="${id}" style="width:100%">Make this my focus</button>` : ''}
          <button class="btn btn-secondary" type="button" data-act="cmpToggle" data-arg="${id}" style="width:100%">${inCmp ? 'Remove from compare' : 'Add to compare'}</button>
          <a class="link-btn" href="#/compare" style="text-align:center">Open compare</a>
        </div></section>
      </div>
    </div></div>`;
}

/* ---------- compare ---------- */
function compareIds() {
  const rk = rankMajors(S);
  const ids = U.compare.filter((id) => MAJOR_BY_ID[id]);
  if (ids.length) return ids;
  return rk.has ? rk.order.slice(0, 3) : MAJORS.slice(0, 3).map((m) => m.id);
}
function viewCompare() {
  const rk = rankMajors(S);
  const ids = compareIds();
  const rows = [
    ['Overlap', (id) => rk.has ? h`<span class="score md">${rk.scores[id]}%</span>${bar(rk.scores[id], 'sm', 'Overlap')}<p class="note" style="margin-top:6px">${bandOf(rk.scores[id])} · illustrative</p>` : h`<span class="note">Take the quiz to see this.</span>`],
    ['Why suggested', (id) => { const ev = rk.has ? evidenceFor(S, id).slice(0, 2) : []; return ev.length ? h`<ul>${ev.map((e) => h`<li>${isFlagged(S, id, e.id) ? h`<s>${evidenceText(e)}</s> <span class="note">(flagged)</span>` : evidenceText(e)}</li>`)}</ul>` : h`<span class="note">Not enough answers yet.</span>`; }],
    ['Less sure about', (id) => rk.has ? h`<ul>${uncertaintyFor(S, id, rk).slice(0, 2).concat(['Ignores grades, course load, admissions and job outcomes.']).map((t) => h`<li>${t}</li>`)}</ul>` : h`<span class="note">Take the quiz first.</span>`],
    ['Typical first classes', (id) => h`<ul>${MAJOR_BY_ID[id].starter.slice(0, 4).map((c) => h`<li>${titleOf(S, c)} <span class="note">${c}</span></li>`)}</ul>`],
    ['Roles people explore', (id) => h`<ul>${MAJOR_BY_ID[id].careers.slice(0, 4).map((c) => h`<li>${c}</li>`)}</ul>`],
    ['Try it first', (id) => h`<p>${MAJOR_BY_ID[id].tryProject}</p>`],
    ['Your choices', (id) => S.challenges[id] ? h`${statusChips(id)}${S.challenges[id].note ? h`<p class="note" style="margin-top:6px">“${S.challenges[id].note}”</p>` : ''}` : h`<span class="note">No challenge yet.</span>`]
  ];
  return h`<div class="wrap page">
    <a class="back" href="#/paths">${icon('arrowLeft', 16)}All paths</a>
    ${pageHead({ eyebrow: 'Compare', title: 'Compare paths', accent: 'side by side.', lede: 'Pick up to three majors. Everything here comes from the sample data in this prototype.' })}
    <div class="pick-row" role="group" aria-label="Choose up to three majors">${MAJORS.map((m) => h`<label class="${ids.indexOf(m.id) >= 0 ? 'on' : ''}"><input type="checkbox" data-change="cmpToggle" data-arg="${m.id}" ${ids.indexOf(m.id) >= 0 ? raw('checked') : ''}>${m.name}</label>`)}</div>
    <div class="card cmp-wrap"><table class="cmp"><caption class="sr-only">Comparison of ${ids.length} majors</caption>
      <thead><tr><td></td>${ids.map((id) => h`<th scope="col">${MAJOR_BY_ID[id].name}<br><a class="link-btn sm" href="#/paths/${id}">Details</a></th>`)}</tr></thead>
      <tbody>${rows.map((r) => h`<tr><th scope="row">${r[0]}</th>${ids.map((id) => h`<td>${r[1](id)}</td>`)}</tr>`)}</tbody></table></div>
    <div class="callout indigo" style="margin-top:20px">${icon('info', 18)}<span><b>Not shown here:</b> costs, admission requirements, and job or salary outcomes. This prototype has no sourced data for them, so it leaves them out instead of guessing. They are on the roadmap.</span></div>
  </div>`;
}

/* ---------- challenge dialog ---------- */
const CHALLENGE_KIND_TEXT = [
  ['nofit', 'This doesn’t fit me', 'Set it aside. You can bring it back any time.'],
  ['reason', 'A reason shown is wrong', 'Pick the lines that do not match you.'],
  ['unsure', 'I am not sure about this one', 'Keep it, but mark it as unsure.'],
  ['explore', 'I want to explore it anyway', 'Pin it to the top, whatever the overlap says.']
];
function challengeModal() {
  const c = U.challenge;
  const m = MAJOR_BY_ID[c.id];
  const ev = evidenceFor(S, c.id);
  return h`<h2 id="modal-title">Challenge: ${m.name}</h2>

function planCard(code, termId, taken) {
  const c = infoOrStub(S, code);

    ${taken ? h`<div style="margin-top:8px">${chip('Taken', 'chip-navy chip-sm')}</div>` : h`<div class="acts no-print"><label class="sr-only" for="mv-${domId(c.code)}">Move ${c.title} to</label><select id="mv-${domId(c.code)}" class="field" data-change="moveSel" data-arg="${code}" data-key="mv-${domId(c.code)}"><option value="">Move to…</option>${!termId ? '' : h`<option value="none">Not scheduled</option>`}${TERMS.filter((t) => t.id !== termId).map((t) => h`<option value="${t.id}" ${S.plan.taken[t.id] ? raw('disabled') : ''}>${t.label}${S.plan.taken[t.id] ? ' (taken)' : ''}</option>`)}</select>

  const bad = codes.filter((c) => prereqIssues(S, c, t.id).length).length;
  const sg = !taken && rankMajors(S).has ? planSuggestions(S, t.id) : { chips: [], locked: null };
  const note = cr > CREDIT_MAX ? 'Over the ' + CREDIT_MAX + '-credit target by ' + (cr - CREDIT_MAX) : cr < CREDIT_MIN && codes.length ? 'Add ' + (CREDIT_MIN - cr) + ' more to reach ' + CREDIT_MIN : codes.length ? 'On target' : '';
  return h`<section class="card pcol" ${taken ? '' : raw('data-drop="' + t.id + '"')} aria-labelledby="t-${t.id}">
    <div class="head"><h2 id="t-${t.id}">${t.label}</h2>${taken ? chip('Taken', 'chip-navy chip-sm') : chip(t.tag, t.id === 'f26' ? 'chip-indigo chip-sm' : 'chip-mint chip-sm')}</div>

    ${codes.length ? (bad ? h`<div class="okline bad">${icon('alert', 16)}<span>Heads up: ${plural(bad, 'class', 'classes')} here need an earlier prerequisite.</span></div>` : h`<div class="okline">${icon('check', 16)}<span>Prerequisites look fine for this term.</span></div>`) : ''}
    ${sg.chips.length ? h`<p class="sub" style="margin:16px 0 0">Pathwise suggests</p><div class="sugg no-print">${sg.chips.map((c) => h`<button type="button" data-act="addSuggested" data-arg="${c.code + '|' + t.id}">${icon('plus', 14)}${c.title}</button>`)}</div>` : ''}
    ${sg.locked ? h`<div class="okline" style="color:#4B5563">${icon('info', 16)}<span>${sg.locked.c.title} needs ${sg.locked.needs.map((p) => titleOf(S, p)).join(' and ')} first.</span></div>` : ''}

  </section>`;

/* ---------- review ---------- */
function draftFor(code) {
  if (U.draft[code]) return U.draft[code];
  const r = S.reviews[code];
  U.draft[code] = r ? { reaction: r.reaction, enjoy: r.enjoy.slice(), expect: r.expect, another: r.another, note: r.note } : { reaction: null, enjoy: [], expect: null, another: null, note: '' };
  return U.draft[code];
}
function withReview(code, d) {
  const c = Object.assign({}, S, { reviews: Object.assign({}, S.reviews) });
  if (d && d.reaction) c.reviews[code] = { reaction: d.reaction, enjoy: d.enjoy, another: d.another };
  else delete c.reviews[code];
  return c;
}
function reviewEffect(code, d) {
  if (!d.reaction) return null;
  const b = withReview(code, null);
  const a = withReview(code, d);
  const rb = rankMajors(b);
  const ra = rankMajors(a);
  const movers = MAJORS.map((m) => ({ id: m.id, was: rb.scores[m.id], now: ra.scores[m.id], delta: ra.scores[m.id] - rb.scores[m.id], wasRank: rankOf(rb.order, m.id), nowRank: rankOf(ra.order, m.id) }))
    .filter((x) => x.delta !== 0 && ra.order.indexOf(x.id) >= 0)
    .sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  const rankMove = movers.filter((x) => x.wasRank && x.nowRank && x.wasRank !== x.nowRank && Math.min(x.wasRank, x.nowRank) <= 5).sort((x, y) => Math.abs(y.wasRank - y.nowRank) - Math.abs(x.wasRank - x.nowRank))[0] || null;
  const cb = classPicks(b).picks.map((p) => p.c.code);
  const fresh = classPicks(a).picks.filter((p) => cb.indexOf(p.c.code) < 0 && S.saved.indexOf(p.c.code) < 0).slice(0, 3);
  return { movers: movers.slice(0, 2), rankMove, fresh };
}
function reviewPanel(code, d) {
  const fx = reviewEffect(code, d);
  if (!fx) return h`<div class="navy-card"><p class="sub">What this changes</p><h3>Pick how the class felt to preview what changes.</h3><p class="n">Your reaction nudges your interest mix, which can reorder your paths and your class picks.</p></div>`;
  return h`<div class="navy-card"><div class="row between"><p class="sub">What this changes</p><span style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase">Preview</span></div>
    <h3>${fx.fresh.length ? plural(fx.fresh.length, 'new class', 'new classes') + ' picked for you' : fx.movers.length ? 'A small nudge to your paths' : 'No change to your paths'}</h3>
