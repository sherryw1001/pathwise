/* ===== app.js: routing, actions, events, start-up ===== */
const NAV = '__nav__';
const appEl = document.getElementById('app');
const TEST_HIDDEN = ['courses', 'plan', 'review', 'path', 'share'];
const TITLES = { home: 'Home', consent: 'Consent', quiz: 'Quiz', paths: 'Your paths', major: 'Major', compare: 'Compare', courses: 'Courses', plan: 'My list', review: 'Review', path: 'My path', share: 'Share summary', about: 'About', roadmap: 'Roadmap' };

function parseRoute() {
  const hash = (window.location.hash || '#/').replace(/^#/, '');
  const parts = hash.split('?')[0].split('/').filter(Boolean);
  const a = parts[0];
  const b = parts[1];
  if (!a) return { name: 'home' };
  if (a === 'paths') {
    if (!b) return { name: 'paths' };
    let id = b;
    try { id = decodeURIComponent(b); } catch (e) { id = b; }
    return { name: 'major', id };
  }
  if (['consent', 'quiz', 'compare', 'courses', 'plan', 'review', 'path', 'share', 'about'].indexOf(a) >= 0) return { name: a };
  return { name: '404' };
}
function go(path) {
  const target = '#' + path;
  if (window.location.hash === target) { render(); return; }
  window.location.hash = target;
}
function resolveRoute(rt) {
  if (S.testMode && TEST_HIDDEN.indexOf(rt.name) >= 0) return { name: 'roadmap', feature: rt.name };
  if (rt.name === 'quiz' && !S.consent) {
    U.after = '/quiz';
    window.location.replace('#/consent');
    return null;
  }
  return rt;
}
function pageFor(rt) {
  switch (rt.name) {
    case 'home': return viewHome();
    case 'consent': return viewConsent();
    case 'quiz': return viewQuiz();
    case 'paths': return viewPaths();
    case 'major': return viewMajor(rt.id);
    case 'compare': return viewCompare();
    case 'courses': return viewCourses();
    case 'plan': return viewPlan();
    case 'review': return viewReview();
    case 'path': return viewMyPath();
    case 'share': return viewShare();
    case 'about': return viewAbout();
    case 'roadmap': return viewRoadmap(rt.feature);
    default: return view404();
  }
}

/* ---------- rendering with focus and scroll kept ---------- */
const cssEsc = (s) => String(s).replace(/["\\]/g, '\\$&');
function focusSelector(el) {
  if (!el || !el.dataset) return null;
  const d = el.dataset;
  const attr = (k, v) => '[data-' + k + '="' + cssEsc(v) + '"]';
  if (d.key) return attr('key', d.key);
  if (el.id) return '[id="' + cssEsc(el.id) + '"]';
  if (d.act) return attr('act', d.act) + (d.arg != null ? attr('arg', d.arg) : '');
  if (d.change) return attr('change', d.change) + (d.arg != null ? attr('arg', d.arg) : '');
  if (d.input) return attr('input', d.input) + (d.arg != null ? attr('arg', d.arg) : '');
  return null;
}
function restoreFocus(sel, caret) {
  if (!sel) return;
  let el = null;
  try { el = appEl.querySelector(sel); } catch (e) { el = null; }
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  if (caret && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) { /* not a text field */ } }
}
let rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try {
    const rt = resolveRoute(parseRoute());
    if (!rt) return;
    if (rt.name === 'paths' && S.quizDone && !S.viewedPaths && rankMajors(S).has) { S.viewedPaths = true; persist(); }
    const ae = document.activeElement;
    const inApp = ae && ae !== document.body && appEl.contains(ae);
    const sel = !U.routeChanged && inApp ? focusSelector(ae) : null;
    const caret = sel && ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
    const y = window.scrollY;
    appEl.innerHTML = String(chrome(rt, pageFor(rt)));
    document.title = 'Pathwise prototype · ' + (TITLES[rt.name] || 'Page');
    if (U.routeChanged) {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const t = document.getElementById('page-title');
      if (t) { try { t.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
      U.routeChanged = false;
    } else {
      window.scrollTo({ top: y, left: 0, behavior: 'instant' });
      restoreFocus(sel, caret);
    }
    if (U.modal && U.modalFocus) {
      const m = appEl.querySelector('.modal');
      if (m) { m.setAttribute('tabindex', '-1'); m.focus({ preventScroll: true }); }
      U.modalFocus = false;
    } else if (!U.modal && U.focusAfterModal) {
      restoreFocus(U.focusAfterModal, null);
      U.focusAfterModal = null;
    }
  } finally {
    rendering = false;
  }
}
function afterAction(res) {
  if (res === NAV) return;
  persist();
  render();
}

/* ---------- modals ---------- */
function openModal(m, trigger) {
  U.modal = m;
  U.modalFocus = true;
  U.focusAfterModal = trigger ? focusSelector(trigger) : null;
}
function closeModal() {
  U.modal = null;
  U.challenge = null;
  render();
}
function confirmModal(o) {
  return h`<h2 id="modal-title">${o.title}</h2><p>${o.body}</p><div class="foot-row"><button class="btn btn-secondary btn-sm" type="button" data-act="modalClose">Cancel</button><button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'} btn-sm" type="button" data-act="${o.yes}" data-arg="${o.arg || ''}">${o.label}</button></div>`;
}
function openConfirm(o, trigger) { openModal({ type: 'confirm', render: () => confirmModal(o) }, trigger); }
function dismissModal() { U.modal = null; U.challenge = null; }

/* ---------- small helpers ---------- */
function hasData() {
  return answeredCount(S) > 0 || S.saved.length > 0 || Object.keys(S.reviews).length > 0 || S.log.length > 0;
}
function download(name, text, type) {
  try {
    const blob = new Blob([text], { type: type || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) { return false; }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const timer = setTimeout(() => finish(fallbackCopy(text)), 1500);
      navigator.clipboard.writeText(text).then(() => { clearTimeout(timer); finish(true); }, () => { clearTimeout(timer); finish(fallbackCopy(text)); });
    });
  }
  return Promise.resolve(fallbackCopy(text));
}
function resetUi() {
  U.draft = {}; U.compare = []; U.reviewCode = null; U.courseMajor = null; U.showAll = false; U.query = ''; U.level = 'all';
  U.paste = ''; U.catalogMsg = null; U.consent = [false, false, false]; U.consentError = false; U.editing = false; U.qHint = null;
  U.challenge = null; U.expandRoles = {}; U.revErr = null;
}
function loadExampleState() {

  S = exampleState();
  S.testMode = tm;
  resetUi();
}

/* ---------- quiz helpers ---------- */
function finishQuiz() {
  if (answeredCount(S) < 3) { U.qHint = 'few'; return; }
  const first = !S.quizDone;
  S.quizDone = true;
  S.baseline = snapshotBaseline(S);

}
function advanceQuiz() {

/* ---------- plan helpers ---------- */
function moveClass(code, target) {
  if (!target || S.saved.indexOf(code) < 0) return;
  const title = titleOf(S, code);
  const cur = S.plan.placed[code];
  if (cur && S.plan.taken[cur]) { toast('Reopen ' + TERM_BY_ID[cur].label + ' to move ' + title + '.'); return; }
  if (target === 'none') {
    if (cur) { delete S.plan.placed[code]; logEvt('Took ' + title + ' off the schedule'); toast(title + ' is back in your unscheduled list.'); }
    return;
  }
  if (!TERM_BY_ID[target]) return;
  if (S.plan.taken[target]) { toast(TERM_BY_ID[target].label + ' is marked as taken. Reopen it to add classes.'); return; }
  S.plan.placed[code] = target;
  logEvt('Planned ' + title + ' for ' + TERM_BY_ID[target].label);
  const issues = prereqIssues(S, code, target);
  toast(issues.length ? 'Heads up: ' + title + ' needs ' + issues.map((i) => i.title).join(' and ') + ' in an earlier term.' : title + ' planned for ' + TERM_BY_ID[target].label + '.');
}
function toggleSave(code) {
  const i = S.saved.indexOf(code);
  const title = titleOf(S, code);
  if (i >= 0) {
    if (S.plan.placed[code] && S.plan.taken[S.plan.placed[code]]) { toast(title + ' is in a term you marked as taken.'); return; }
    S.saved.splice(i, 1);
    delete S.plan.placed[code];
    delete S.reviews[code];
    logEvt('Removed ' + title + ' from my list');
    toast('Removed ' + title + ' from My list.');
  } else {
    S.saved.push(code);
    logEvt('Saved ' + title);
    toast('Saved ' + title + ' to My list.');
  }
}

/* ---------- class list import ---------- */
function applyCatalog(text, name) {
  const res = parseCatalogText(text);
  if (!res.items.length) { U.catalogMsg = { kind: 'err', text: 'I could not find any class codes (like CS 1110) in that text.' }; render(); return; }
  S.catalog = { mode: 'upload', name: String(name || 'Pasted list').slice(0, 80), items: res.items, stats: res.stats };
  res.items.forEach((it) => { if (!it.recognized) S.custom[it.code] = it; });
  U.catalogMsg = { kind: 'ok', text: 'Read ' + plural(res.items.length, 'class', 'classes') + ', ' + res.stats.recognized + ' with sample tags.' };
  U.courseMajor = null; U.showAll = false; U.query = ''; U.level = 'all';
  logEvt('Added my class list (' + plural(res.items.length, 'class', 'classes') + ')');
  toast('Read ' + plural(res.items.length, 'class', 'classes') + ' from your list.');
  persist();
  render();
}
function readCatalogFile(file) {
  if (!file) return;
  if (/\.(pdf|xlsx?|docx?|pages|numbers)$/i.test(file.name)) {
    U.catalogMsg = { kind: 'err', text: 'This prototype reads .csv and .txt only. Export your list as CSV or paste it into the box.' };
    render();
    return;
  }
  if (file.size > 1048576) { U.catalogMsg = { kind: 'err', text: 'That file is bigger than 1 MB. Try a shorter list.' }; render(); return; }
  const fr = new FileReader();
  fr.onload = () => applyCatalog(String(fr.result || ''), file.name);
  fr.onerror = () => { U.catalogMsg = { kind: 'err', text: 'I could not read that file.' }; render(); };
  fr.readAsText(file);
}

    if (!classInfo(S, code)) return;
    if (S.saved.indexOf(code) < 0) S.saved.push(code);
    moveClass(code, term);
  },

  revSelect(code) { U.reviewCode = code; U.revErr = null; U.routeChanged = false; },
  revReaction(id) { draftFor(currentReviewCode()).reaction = id; U.revErr = null; },
  revEnjoy(id) {
    const d = draftFor(currentReviewCode());
    const i = d.enjoy.indexOf(id);
    if (i >= 0) d.enjoy.splice(i, 1); else d.enjoy.push(id);
  },
  revExpect(n) { const d = draftFor(currentReviewCode()); const v = parseInt(n, 10); d.expect = d.expect === v ? null : v; },
  revAnother(id) { const d = draftFor(currentReviewCode()); d.another = d.another === id ? null : id; },
  revSave() {
    const code = currentReviewCode();
    const d = draftFor(code);
    if (!d.reaction) { U.revErr = 'Choose how the class felt first.'; return; }
    S.reviews[code] = { reaction: d.reaction, enjoy: d.enjoy.slice(), expect: d.expect, another: d.another, note: d.note.trim().slice(0, 500), ts: Date.now() };
    delete U.draft[code];
    U.revErr = null;
    logEvt('Reviewed ' + titleOf(S, code) + ': ' + REACTION_BY_ID[d.reaction].label);
    toast('Review saved. Your paths were updated.');
    const queue = reviewQueue(S);
    const next = queue.find((c) => !S.reviews[c]);
    U.reviewCode = next || code;
  },
  revSkip() {
    const queue = reviewQueue(S);
    const code = currentReviewCode();
    const i = queue.indexOf(code);
    U.reviewCode = queue[(i + 1) % queue.length];
    U.revErr = null;
  },
  revRemove() {
    const code = currentReviewCode();
    delete S.reviews[code];
    delete U.draft[code];
    logEvt('Removed my review of ' + titleOf(S, code));
    toast('Review removed. Your paths were updated.');
  },
  reviewOpen(code) { U.reviewCode = code; go('/review'); return NAV; },

  shareCopy() {
    copyText(summaryText(S, U.share)).then((ok) => { toast(ok ? 'Summary copied. Paste it wherever you like.' : 'Could not copy. Select the preview text and copy it by hand.'); });
    return NAV;
  },
  shareDownload() {
    const ok = download('pathwise-summary.txt', summaryText(S, U.share), 'text/plain');
    toast(ok ? 'Summary downloaded.' : 'Could not start the download in this browser.');
  },
  sharePrint() { window.print(); return NAV; }
};
function currentReviewCode() {
  const queue = reviewQueue(S);
  return queue.indexOf(U.reviewCode) >= 0 ? U.reviewCode : (queue.find((c) => !S.reviews[c]) || queue[0]);
}
function toggleCompare(id) {
  let ids = compareIds().slice();
  const i = ids.indexOf(id);
  if (i >= 0) ids.splice(i, 1);
  else if (ids.length >= 3) { toast('Compare up to 3 at a time. Remove one first.'); return; }
  else ids.push(id);
  U.compare = ids;
}

const INPUT = {
  paste(v) { U.paste = v; return false; },
  query(v) { U.query = v; return 'render'; },
  chNote(v) { if (U.challenge) U.challenge.note = v; return false; },
  revNote(v) { const d = draftFor(currentReviewCode()); d.note = v.slice(0, 500); return false; },
  reflect(v, arg) { if (REFLECT_PROMPTS.some((p) => p.id === arg)) S.reflect[arg] = v.slice(0, 1500); return 'save'; }
};
const CHANGE = {
  consentToggle(checked, arg) { U.consent[parseInt(arg, 10)] = !!checked; if (U.consent.every(Boolean)) U.consentError = false; },
  chKind(v, arg) { if (U.challenge) { U.challenge.kind = arg; U.challenge.err = ''; } },
  chFlag(checked, arg) {
    const c = U.challenge;
    if (!c) return;
    const i = c.flagged.indexOf(arg);
    if (checked && i < 0) c.flagged.push(arg);
    if (!checked && i >= 0) c.flagged.splice(i, 1);
    c.err = '';
  },
  cmpToggle(checked, arg) { toggleCompare(arg); },
  moveSel(v, arg) { if (v) moveClass(arg, v); },
  focusSel(v) { if (MAJOR_BY_ID[v]) { S.focus = v; S.focusChosen = true; logEvt('Chose ' + MAJOR_BY_ID[v].name + ' as my focus'); toast('Your focus is now ' + MAJOR_BY_ID[v].name + '.'); } },
  shareToggle(checked, arg) { if (arg in U.share) U.share[arg] = !!checked; return NAV; },
  catFile(v, arg, el) { const f = el.files && el.files[0]; el.value = ''; readCatalogFile(f); return NAV; }
};

/* ---------- events ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t) {
    const tgt = ev.target.closest ? ev.target : null;
    if (U.menuOpen && tgt && (!tgt.closest('.nav') || tgt.closest('.nav-links a'))) { U.menuOpen = false; render(); }
    return;
  }
  const fn = ACT[t.dataset.act];
  if (!fn) return;
  if (t.tagName === 'A' && t.dataset.act !== 'skip') return;
  afterAction(fn(t.dataset.arg, t, ev));
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  const k = t && t.dataset ? t.dataset.input : null;
  if (!k || !INPUT[k]) return;
  const res = INPUT[k](t.value, t.dataset.arg, t);
  if (res === 'render') { render(); return; }
  if (res === 'save') persist();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  const k = t && t.dataset ? t.dataset.change : null;
  if (!k || !CHANGE[k]) return;
  const res = CHANGE[k](t.type === 'checkbox' || t.type === 'radio' ? t.checked : t.value, t.dataset.arg, t, ev);
  if (res === NAV) { persist(); render(); return; }
  afterAction(res);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (U.modal) { closeModal(); } else if (U.menuOpen) { U.menuOpen = false; render(); }
    return;
  }
  if (ev.key === 'Tab' && U.modal) {
    const m = document.querySelector('.modal');
    if (!m) return;
    const f = Array.prototype.slice.call(m.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled])')).filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === m)) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
document.addEventListener('dragstart', (ev) => {
  const t = ev.target.closest ? ev.target.closest('[data-drag]') : null;
  if (!t) return;
  U.drag = t.dataset.drag;
  try { ev.dataTransfer.setData('text/plain', U.drag); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* ignore */ }
  t.classList.add('dragging');
});
document.addEventListener('dragend', () => {
  U.drag = null;
  document.querySelectorAll('.dragging').forEach((e) => e.classList.remove('dragging'));
  document.querySelectorAll('.over').forEach((e) => e.classList.remove('over'));
});
const hasFiles = (ev) => ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0;
document.addEventListener('dragover', (ev) => {
  const z = ev.target.closest ? ev.target.closest('[data-drop]') : null;
  if (z && U.drag) { ev.preventDefault(); try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { /* ignore */ } z.classList.add('over'); return; }
  const f = ev.target.closest ? ev.target.closest('[data-dropfile]') : null;
  if (f) { ev.preventDefault(); f.classList.add('over'); return; }
  if (hasFiles(ev)) ev.preventDefault();
});
document.addEventListener('dragleave', (ev) => {
  const z = ev.target.closest ? ev.target.closest('[data-drop],[data-dropfile]') : null;
  if (z && !z.contains(ev.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', (ev) => {
  const f = ev.target.closest ? ev.target.closest('[data-dropfile]') : null;
  if (f) { ev.preventDefault(); f.classList.remove('over'); readCatalogFile(ev.dataTransfer.files && ev.dataTransfer.files[0]); return; }
  const z = ev.target.closest ? ev.target.closest('[data-drop]') : null;
  if (z && U.drag) {
    ev.preventDefault();
    const code = U.drag;
    U.drag = null;
    moveClass(code, z.dataset.drop);
    persist();
    render();
    return;
  }
  if (hasFiles(ev)) ev.preventDefault();
});
window.addEventListener('hashchange', () => { U.routeChanged = true; U.menuOpen = false; dismissModal(); U.qHint = null; render(); });

/* ---------- start ---------- */
function init() {
  S = loadState();
  const params = new URLSearchParams(window.location.search);
  if (params.get('test') === '1') S.testMode = true;
  if (params.get('demo') === '1' && !hasData() && !S.consent) { const tm = S.testMode; S = exampleState(); S.testMode = tm; persist(); }
  window.PW = {
    get S() { return S; }, U, ACT, INPUT, CHANGE, go, render, persist, exampleState, defaultState, sanitize,
    E: { rankMajors, classPicks, evidenceFor, uncertaintyFor, profileVec, summaryText, parseCatalogText, stepsList, pathNodes, movedList, coverage, reviewQueue },
    reset() { S = defaultState(); storeClear(); resetUi(); render(); }
  };
  render();
}
init();

})();
</script>
